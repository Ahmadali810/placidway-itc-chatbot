<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITC Treatment Assistant — PlacidWay Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #f4f6f8; color: #1a1a1a; display: flex;
         flex-direction: column; height: 100vh; }
  header { background: #0e6b4f; color: #fff; padding: 16px 20px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header p { font-size: 13px; opacity: .85; margin-top: 4px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; max-width: 760px;
          width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px;
         font-size: 14px; line-height: 1.55; white-space: normal; }
  .msg.user { align-self: flex-end; background: #0e6b4f; color: #fff;
              border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #1a1a1a;
             border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .msg.bot p { margin: 6px 0; }
  .msg.bot ul { margin: 6px 0 6px 18px; }
  .msg.bot li { margin: 3px 0; }
  .msg.typing { opacity: .6; font-style: italic; }
  #composer { display: flex; gap: 10px; padding: 14px 20px; background: #fff;
              border-top: 1px solid #e2e2e2; max-width: 760px; width: 100%; margin: 0 auto; }
  #input { flex: 1; padding: 12px 14px; font-size: 14px; border: 1px solid #ccc;
           border-radius: 24px; outline: none; }
  #input:focus { border-color: #0e6b4f; }
  #send { padding: 0 22px; font-size: 14px; font-weight: 600; color: #fff;
          background: #0e6b4f; border: none; border-radius: 24px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  footer { text-align: center; font-size: 11px; color: #888; padding: 8px; }
</style>
</head>
<body>
<header>
  <h1>ITC Treatment Assistant</h1>
  <p>PlacidWay assessment demo — answers come only from the 7 official ITC Immunity Therapy Center pages.</p>
</header>
<div id="chat"></div>
<div id="composer">
  <input id="input" type="text" placeholder="Ask about ITC treatments, packages, prices..." autocomplete="off">
  <button id="send">Send</button>
</div>
<footer>Demo for assessment purposes. Not medical advice — consult your doctor.</footer>

<script>
const WEBHOOK_URL = "https://nofiyi2989copytoshcom.app.n8n.cloud/webhook/c6d9fd9d-6f0e-49cd-9522-1f0816da0572/chat";
const sessionId = "web-" + Math.random().toString(36).slice(2, 10);
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const lines = html.split("\n");
  let out = "", inList = false;
  for (const line of lines) {
    const t = line.trim();
    if (/^[-*]\s+/.test(t)) {
      if (!inList) { out += "<ul>"; inList = true; }
      out += "<li>" + t.replace(/^[-*]\s+/, "") + "</li>";
    } else {
      if (inList) { out += "</ul>"; inList = false; }
      if (t) out += "<p>" + t + "</p>";
    }
  }
  if (inList) out += "</ul>";
  return out || "<p></p>";
}
function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.innerHTML = who === "bot" ? renderMarkdown(text) : escapeHtml(text);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendBtn.disabled = true;
  addMsg(text, "user");
  const typing = addMsg("Typing...", "bot typing");
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "sendMessage", sessionId, chatInput: text })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    typing.remove();
    addMsg(data.output || "Sorry, I got an empty response. Please try again.", "bot");
  } catch (e) {
    typing.remove();
    addMsg("Sorry, the bot is unreachable right now. Please try again in a moment.", "bot");
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
addMsg("Hi! Ask me anything about ITC Immunity Therapy Center treatments, packages, or prices.", "bot");
input.focus();
</script>
</body>
</html>
